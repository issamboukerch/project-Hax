<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HexaRays</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        font-family: "Poppins", sans-serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        outline: none;
        border: none;
        text-decoration: none;
        text-transform: capitalize;
        transition: 0.2s linear;
      }
      body {
        background-color: rgb(225, 225, 225);
      }
      .header {
        display: flex;
        justify-content: center;
      }
      .sidebar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 90px;
        margin-top: 20px;
        background-color: #fff;
        border-radius: 15px;
        width: 90%;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      }
      a {
        text-decoration: none;
        font-size: 18px;
        color: black;
      }
      #fonts {
        font-size: 19px;
        padding: 5px;
        margin-right: 26px;
      }
      .logo {
        width: 80px;
        height: 80px;
        border: none;
        margin-left: 20px;
      }
      .btn {
        margin-top: 10px;
        display: inline-block;
        background: #333;
        color: #fff;
        font-size: 17px;
        border-radius: 5px;
        margin-right: 25px;
      }

      .btn:hover {
        letter-spacing: 1px;
      }
      #link-bag {
        font-size: 19px;
        padding: 10px;
        padding-top: 12px;
      }
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .all-img {
        height: 80vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .img1 {
        display: flex;
        flex-direction: column;
      }
      .imge {
        height: 19vh;
        margin-bottom: 12px;
        padding: 5px;
        cursor: pointer;
        opacity: 0.6;
        border-radius: 15px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .imge:hover {
        opacity: 1;
      }
      .imge2 {
        height: 380px;
        width: 340px;
        margin-left: 40px;
        padding: 5px;
        border-radius: 15px;
      }
      p {
        margin-bottom: 20px;
      }
      .img2 {
        display: flex;
      }
      .info {
        width: 350px;
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
      }
      .product_title {
        font-size: 40px;
        margin-bottom: 10px;
      }
      .btn-info {
        margin-top: 10px;

        background: #333;
        color: #fff;
        font-size: 17px;
        border-radius: 5px;
        margin-right: 25px;
        padding: 10px;
      }

      .font-info {
        margin-left: 50%;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="sidebar">
        <img class="logo" src="/img/Screensho.jpg" alt="" />
        <a href="">About</a>
        <a href="">Home</a>
        <a href="">Admin</a>

        <div class="logos">
          <a href="" class="btn"
            ><i id="link-bag" class="fa-solid fa-bag-shopping fa-bounce"></i
          ></a>
        </div>
      </div>
    </div>
    <div class="container">
      <div class="product-info">
        <div class="all-img">
          <div class="img1">
            <a href=""><i class="fa-solid fa-chevron-left"></i>Back</a>
            <img
              class="imge"
              src="https://th.bing.com/th/id/R.fc9db452e0f50da43c1eaf2c0bace98f?rik=458LVE%2bXrpBt1Q&riu=http%3a%2f%2fwww.lgnewsroom.com%2fwp-content%2fuploads%2f2017%2f08%2fLG-V30-Cloud-Silver.jpg&ehk=sWdXonoW1IMWu7D3P1T1yk38ODr9xZMv55O7UXpZw98%3d&risl=&pid=ImgRaw&r=0"
              alt=""
              onclick="clickimg(this)"
            />
            <img
              class="imge"
              src="https://cdn.wccftech.com/wp-content/uploads/2017/08/LG-V30-Angle.jpg"
              alt=""
              onclick="clickimg(this)"
            />
            <img
              class="imge"
              src="https://m.phonegg.com/93/9388b-2.jpg"
              alt=""
              onclick="clickimg(this)"
            />
          </div>

          <div class="img2">
            <img
              class="imge2"
              id="img5"
              src="https://th.bing.com/th/id/R.955ddb9ddf754634ced865c093e8beea?rik=vMttmQ8l2Y68ew&riu=http%3a%2f%2fwww.lgnewsroom.com%2fwp-content%2fuploads%2f2017%2f08%2fLG-V30-Moroccan-Blue.jpg&ehk=X4r5JUGrjLrRUXh8ckPWLrAAKX66KW8%2fwJNFrIj3seM%3d&risl=&pid=ImgRaw&r=0"
              alt=""
            />
            <div class="info">
              <h2 class="product_title">iphone 12</h2>
              <p class="product-inform">lg v30 120 ddkdjc</p>
              <p>200$</p>
              <div class="font-info">
                <a href="#" class="btn-info">Add To Bag</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      function clickimg(img1) {
        let img = document.querySelector("#img5");
        img.src = img1.src;
      }
    </script>
  </body>
</html>
