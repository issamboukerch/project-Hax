<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        font-family: "Poppins", sans-serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        outline: none;
        border: none;
        text-decoration: none;
        text-transform: capitalize;
        transition: 0.2s linear;
      }
      body {
        display: flex;
        justify-content: center;
        padding: 10%;

        background-color: rgb(187, 187, 187);
        font-family: sans-serif;
        font-weight: 100;
      }
      .table-div {
        border: none;
        border-radius: 15px;
      }
      table {
        border-radius: 15px;
        border: none;
        box-shadow: 0 0 20px;
        background-color: rgb(251, 251, 251);
      }
      thead {
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
        margin-bottom: 5p0x;
        border: none;
      }

      th {
        padding: 25px;
        font-family: Arial, sans-serif;
        font-weight: bold;
        font-size: 20px;
      }
      td {
        text-align: center;
        padding: 25px;
        font-family: Arial, sans-serif;
        font-size: 18px;
      }
      a {
        display: flex;
        justify-content: space-around;
        text-decoration: none;
        color: black;
        font-size: 25px;
        box-shadow: 0 0 10px;
        margin: 20px;
        padding: 10px;
        border-radius: 15px;
      }

      td {
        font-weight: bold;
        font-size: 20px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .d {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #333;
        color: #fff;
        font-size: 17px;
        padding: 10px;
        width: 90px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      }
      .e {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #333;
        color: #fff;
        font-size: 17px;
        padding: 10px;
        width: 90px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        box-shadow: 0 0 10px;
        margin: 20px;
        padding: 10px;
        border-radius: 15px;
      }
      .d:hover {
        letter-spacing: 1px;
        box-shadow: 0 0 10px rgba(255, 3, 3, 0.9);
        transform: scale(1.06);
      }
      .e:hover {
        letter-spacing: 1px;
        box-shadow: 0 0 10px rgba(17, 0, 255, 0.9);
        transform: scale(1.06);
      }
      i {
        margin-right: 5px;
      }
      .back {
        display: flex;
      }
      .back-btn {
        display: flex;
        justify-content: center;
        align-items: center;
        background: #333;
        color: #fff;
        font-size: 17px;
        padding: 25px;
        width: 110px;
        font-size: 20px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
      }
      .back-btn:hover {
        letter-spacing: 2px;
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.5);
        transform: scale(1.03);
      }
      label {
        cursor: pointer;
      }
      .test {
        display: none;
      }
      #ch {
        display: none;
      }
      #ch:checked ~ .test {
        display: block;
      }
      #ch:checked ~ label {
        display: none;
      }
      .save{
        display: none;
      }
      .save--show{
        display: inline;
      }
    </style>
  </head>
  <body>
    <div class="body">
      <div class="back">
        <a class="back-btn" href=""
          ><i class="fa-solid fa-chevron-left"></i>Back</a
        >
      </div>
      <div class="table-div">
        <table>
          <thead>
            <th>Id</th>
            <th>Name</th>
            <th>price</th>
            <th>imge</th>
          </thead>
          <tbody>
            <tr>
              <td>1</td>
              <td>LG</td>
              <td>200$</td>
              <td>
                <p>
                  https://th.bing.com/th/id/OIP._J20UuD1DaQ8Hq8sC6zpjwHaFO?w=263&h=186&c=7&r=0&o=5&dpr=1.3&pid=1.7
                </p>
              </td>
              <td>
                <button type="submit" class="btn-info" >   <i class="fa-regular fa-rectangle-xmark"></i>Delete</a
                ></button>
                <div class="cunt_r">
                  <div class="cont">
                  <a href=""  class="cunt_r">
                      <i class="fa-solid fa-pen-to-square"></i>Edit
                      </a>
                      <div class="save">
                      <a href="">
                        <i class="fa-regular fa-square-check"></i>Save</label
                      >
                      </a>
                      </div>
                  </div>
                      
                </div>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <script>
        let edit = document.querySelector(".cont_r");
      edit.addEventListener("click", event=> {
        let edi= event.target;
        let ifbtn_edit= edi.className.includes("btn_edit");
        if(!ifbtn_edit) return;
        let save=event.target.parentNode.querySelector(".save");
        save.classList.toggle("save--show");
        save.textContent = save.textContent.includes("Edit")?"save":"save";
      });
    </script>
  </body>
</html>
